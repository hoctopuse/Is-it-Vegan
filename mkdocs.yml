site_name: Is It Vegan? — Documentation technique
site_description: Fonctionnement et architecture de Is It Vegan? jusqu’à 0.6.13.7, avant la version 0.7
docs_dir: docs
site_dir: site
not_in_nav: |
  generated/base-connaissances-data.md
  generated/multilingual-ingredient-mapping.md
theme:
  name: material
  language: fr
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Présentation: index.md
  - Architecture générale: architecture.md
  - Pipeline OCR: ocr.md
  - Segmentation des langues: langues.md
  - Extraction des sections: sections.md
  - Parsing des ingrédients: parsing.md
  - Matching des ingrédients: matching.md
  - Base de connaissances: base-connaissances.md
  - Pipeline de connaissances et importeurs: knowledge-pipeline.md
  - Référentiel des additifs UE: additifs.md
  - Sources:
    - Extraction annexe II-B UE: sources/eu-additives-annex-ii-b.md
    - Directive UE sur le miel: sources/eu-honey-directive.md
    - Directive UE sur les laits conserv?s: sources/eu-preserved-milk-directive.md
    - Directive UE sur les confitures: sources/eu-jams-directive.md
    - Règlement UE sur les produits agricoles: sources/eu-agricultural-products-regulation.md
    - Directive UE cacao et chocolat: sources/eu-cocoa-chocolate-directive.md
    - Règlement UE sur les arômes: sources/eu-flavourings-regulation.md
    - Règlement FIC sur l’information alimentaire: sources/eu-fic-1169-2011.md
  - Moteur de verdict: verdict.md
  - Notes de version: changelog.md
  - Tests: tests.md
  - Diagnostic: diagnostic.md
  - Vie privée et hors ligne: vie-privee.md
  - Guide développeur: guide-developpeur.md
